services:
  mongodb_container:
    image: docker.io/mongo:latest
    container_name: mongo_soarca_stack
    environment:
      MONGO_INITDB_ROOT_USERNAME: "root"
      MONGO_INITDB_ROOT_PASSWORD: "rootpassword"
    networks:
      - db-net
    volumes:
      - type: volume
        source: mongodb_data_container
        target: /data/db

  soarca-gui:
    image: docker.io/cossas/soarca-gui:latest
    container_name: soarca_gui
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 8081
      SOARCA_URI: "http://soarca_server:8080"
      GIN_MODE: "release"
      AUTH_ENABLED: false
      AUTH_ENABLED_TO_SOARCA: false
      NODE_ENV: production
      NGINX_BACKEND_URL: ${NGINX_BACKEND_URL:-http://host.docker.internal:8080/}
      NGINX_SERVER_PORT: ${NGINX_SERVER_PORT:-8081}
    networks:
      - soarca-net
    ports:
      - 127.0.0.1:8081:8081
    depends_on:
      - soarca
    profiles:
      - gui

  soarca:
    image: docker.io/cossas/soarca:latest
    container_name: soarca_server
    environment:
      PORT: 8080
      SOARCA_ALLOWED_ORIGINS: "*"
      GIN_MODE: "release"
      MONGODB_URI: "mongodb://mongodb_container:27017"
      DATABASE_NAME: "soarca"
      DB_USERNAME: "root"
      DB_PASSWORD: "rootpassword"
      PLAYBOOK_API_LOG_LEVEL: trace
      DATABASE: "true"
      LOG_GLOBAL_LEVEL: "info"
      LOG_MODE: "production"
      LOG_FILE_PATH: ""
      LOG_FORMAT: "json"
      HTTP_SKIP_CERT_VALIDATION: false
      # Integrations:
      # The Hive
      THEHIVE_ACTIVATE: false
      THEHIVE_API_TOKEN: your_token
      THEHIVE_API_BASE_URL: http://localhost:9000/api/v1/
    networks:
      - db-net
      - soarca-net
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      - mongodb_container

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data_container:/loki
    ports:
      - 127.0.0.1:3100:3100

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    command: run /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.0.1
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana_data_container:/var/lib/grafana
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      - loki

networks:
  db-net:
  soarca-net:

volumes:
  mongodb_data_container:
  loki_data_container:
  grafana_data_container:
