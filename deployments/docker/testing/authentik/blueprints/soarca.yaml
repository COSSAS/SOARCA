# authentik blueprint for testing SOARCA (authentik 2026.8).
#
# Creates:
#   groups           soarca_read, soarca_write, soarca_execute, soarca_admin
#                    (mapped to SOARCA permissions by name, see pkg/auth/providers/oidc/roles.go)
#   users            soc-admin, author, analyst, reader (browser login and app passwords)
#   service account  svc-webhook (app password)
#   scope            "soarca": adds group_ids (group UUIDs) to tokens
#   provider         "soarca": confidential OAuth2/OIDC, signed with a key
#   application      slug "soarca", so the issuer is http://localhost:9000/application/o/soarca/
#
# Values come from the environment set in docker-compose.yml. Test only: the
# app passwords never expire.
version: 1
metadata:
  name: SOARCA test setup
  labels:
    blueprints.goauthentik.io/description: Groups, users, provider and application for testing SOARCA authentication
entries:
  # ---------- groups SOARCA maps to permissions ----------
  - model: authentik_core.group
    id: g-read
    identifiers: {name: soarca_read}
  - model: authentik_core.group
    id: g-write
    identifiers: {name: soarca_write}
  - model: authentik_core.group
    id: g-execute
    identifiers: {name: soarca_execute}
  - model: authentik_core.group
    id: g-admin
    identifiers: {name: soarca_admin}

  # ---------- users ----------
  - model: authentik_core.user
    id: u-admin
    identifiers: {username: soc-admin}
    attrs:
      name: SOC Admin
      email: soc-admin@soarca.test
      type: internal
      password: !Env [SOARCA_TEST_PASSWORD, soarca-test]
      groups: [!KeyOf g-admin]
  - model: authentik_core.user
    id: u-author
    identifiers: {username: author}
    attrs:
      name: Alice Author
      email: author@soarca.test
      type: internal
      password: !Env [SOARCA_TEST_PASSWORD, soarca-test]
      groups: [!KeyOf g-write]
  - model: authentik_core.user
    id: u-analyst
    identifiers: {username: analyst}
    attrs:
      name: Bob Analyst
      email: analyst@soarca.test
      type: internal
      password: !Env [SOARCA_TEST_PASSWORD, soarca-test]
      groups: [!KeyOf g-execute]
  - model: authentik_core.user
    id: u-reader
    identifiers: {username: reader}
    attrs:
      name: Carol Reader
      email: reader@soarca.test
      type: internal
      password: !Env [SOARCA_TEST_PASSWORD, soarca-test]
      groups: [!KeyOf g-read]
  - model: authentik_core.user
    id: u-webhook
    identifiers: {username: svc-webhook}
    attrs:
      name: Webhook integration
      type: service_account
      groups: [!KeyOf g-execute]

  # ---------- app passwords: username + app password = token ----------
  # Each user's app password is "<username>-token". Test only: they never expire.
  - model: authentik_core.token
    identifiers: {identifier: soarca-test-soc-admin}
    attrs:
      user: !KeyOf u-admin
      intent: app_password
      expiring: false
      key: soc-admin-token
      description: SOARCA test app password
  - model: authentik_core.token
    identifiers: {identifier: soarca-test-author}
    attrs:
      user: !KeyOf u-author
      intent: app_password
      expiring: false
      key: author-token
      description: SOARCA test app password
  - model: authentik_core.token
    identifiers: {identifier: soarca-test-analyst}
    attrs:
      user: !KeyOf u-analyst
      intent: app_password
      expiring: false
      key: analyst-token
      description: SOARCA test app password
  - model: authentik_core.token
    identifiers: {identifier: soarca-test-reader}
    attrs:
      user: !KeyOf u-reader
      intent: app_password
      expiring: false
      key: reader-token
      description: SOARCA test app password
  - model: authentik_core.token
    identifiers: {identifier: soarca-test-svc-webhook}
    attrs:
      user: !KeyOf u-webhook
      intent: app_password
      expiring: false
      key: svc-webhook-token
      description: SOARCA test app password

  # ---------- scope with stable group IDs, for per-playbook access later ----------
  - model: authentik_providers_oauth2.scopemapping
    id: scope-soarca
    identifiers: {name: "SOARCA: group IDs"}
    attrs:
      scope_name: soarca
      description: SOARCA group membership
      expression: |
        return {"group_ids": [str(group.pk) for group in request.user.groups.all()]}

  # ---------- OAuth2 / OIDC provider ----------
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers: {name: soarca}
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # Without a signing key authentik signs with the client secret (HS256),
      # which SOARCA rejects.
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      client_type: confidential
      client_id: !Env [SOARCA_CLIENT_ID, soarca]
      client_secret: !Env [SOARCA_CLIENT_SECRET, soarca-test-client-secret]
      grant_types: [authorization_code, refresh_token, client_credentials]
      redirect_uris:
        - matching_mode: strict
          url: !Env [SOARCA_GUI_REDIRECT_URI, "http://localhost:8081/auth/soarca_gui/callback"]
          redirect_uri_type: authorization
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_code_validity: minutes=1
      access_token_validity: hours=8
      refresh_token_validity: days=1
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf scope-soarca

  # ---------- application ----------
  - model: authentik_core.application
    identifiers: {slug: soarca}
    attrs:
      name: SOARCA
      provider: !KeyOf provider
      meta_launch_url: http://localhost:8081
